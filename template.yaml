AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DB-less RAG demo using S3 Files, ripgrep, and provider-agnostic LangChain LLMs.

Parameters:
  LLMProvider:
    Type: String
    AllowedValues: [openai, anthropic, bedrock]
  LLMModel:
    Type: String
    Default: demo
  LLMSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN containing {"apiKey":"..."}; not needed for Bedrock.
  RipgrepLayerArn:
    Type: String
    Default: ""
    Description: ARN of a Lambda layer containing the rg binary.
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Browser origin allowed to call the HTTP API.

Conditions:
  HasLlmSecret: !Not [!Equals [!Ref LLMSecretArn, ""]]
  HasRipgrepLayer: !Not [!Equals [!Ref RipgrepLayerArn, ""]]
  IsBedrockProvider: !Equals [!Ref LLMProvider, bedrock]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        LLM_PROVIDER: !Ref LLMProvider
        LLM_MODEL: !Ref LLMModel
        LLM_SECRET_ARN: !If [HasLlmSecret, !Ref LLMSecretArn, ""]

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub
        - "${StackUuid}-documents"
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: [!Ref FrontendOrigin]
            ExposedHeaders: [ETag]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      # Required by S3 Files itself, not by any rule in this template. S3 Files keeps the mounted
      # filesystem in sync with the bucket by consuming these events through its own
      # DO-NOT-DELETE-S3-Files-* EventBridge rule. Turn this off and objects written with the S3 API
      # (the browser's presigned PUT) never appear under the mount.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
  # Processing is queue-driven: the browser calls POST /document/process after its S3 upload and
  # API Gateway puts the message on this queue directly. The bucket publishes no events, so it has
  # no dependency on the processor and the old bucket -> permission -> processor -> mount -> bucket
  # CloudFormation cycle cannot form.
  DocumentProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      # An object PUT straight to S3 takes a moment to appear through the S3 Files mount, so the
      # first delivery is held back and redelivery is quick: retries are the propagation wait.
      DelaySeconds: 30
      # Must be at least the processor's Timeout so a slow extraction is not redelivered mid-flight.
      VisibilityTimeout: 150
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DocumentProcessingDeadLetterQueue.Arn
        maxReceiveCount: 5

  DocumentProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  ApiGatewayQueueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToDocumentProcessingQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DocumentProcessingQueue.Arn

  RagVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: db-less-rag-vpc

  RetrievalSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RagVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false

  RetrievalRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RagVpc

  RetrievalRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RetrievalRouteTableA
      SubnetId: !Ref RetrievalSubnetA

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref RagVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RetrievalRouteTableA

  BedrockRuntimeVpcEndpoint:
    Condition: IsBedrockProvider
    Type: AWS::EC2::VPCEndpoint
    Properties:
      # The question Lambda runs in the private VPC subnet. Bedrock uses this endpoint for private
      # model calls without a NAT gateway. OpenAI/Anthropic are still code-supported, but their
      # public APIs require outbound internet access and API keys from Secrets Manager, which this
      # no-NAT test VPC does not provide.
      VpcId: !Ref RagVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.bedrock-runtime
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref RetrievalSubnetA]
      SecurityGroupIds: [!Ref RetrievalSecurityGroup]

  RetrievalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows retrieval Lambdas to reach S3 Files over NFS and Bedrock over HTTPS.
      VpcId: !Ref RagVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  RetrievalSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RetrievalSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref RetrievalSecurityGroup

  RetrievalSecurityGroupHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RetrievalSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref RetrievalSecurityGroup

  S3FilesServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*"
      Policies:
        - PolicyName: ReadDocumentsForS3Files
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt DocumentsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject*
                  - s3:GetObject*
                  - s3:List*
                  - s3:PutObject*
                Resource: !Sub "${DocumentsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                Condition:
                  StringEquals:
                    events:ManagedBy: elasticfilesystem.amazonaws.com
                Resource: !Sub "arn:${AWS::Partition}:events:*:*:rule/DO-NOT-DELETE-S3-Files*"
              - Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListRuleNamesByTarget
                  - events:ListRules
                  - events:ListTargetsByRule
                Resource: !Sub "arn:${AWS::Partition}:events:*:*:rule/*"

  DocumentsS3FileSystem:
    Type: AWS::S3Files::FileSystem
    Properties:
      AcceptBucketWarning: true
      Bucket: !GetAtt DocumentsBucket.Arn
      RoleArn: !GetAtt S3FilesServiceRole.Arn
      Tags:
        - Key: Name
          Value: db-less-rag-documents

  S3FilesMountTargetA:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !Ref DocumentsS3FileSystem
      SubnetId: !Ref RetrievalSubnetA
      SecurityGroups: [!Ref RetrievalSecurityGroup]

  DocumentsS3FilesAccessPoint:
    Type: AWS::S3Files::AccessPoint
    Properties:
      FileSystemId: !Ref DocumentsS3FileSystem
      PosixUser:
        Uid: 1000
        Gid: 1000
      RootDirectory:
        Path: /
      Tags:
        - Key: Name
          Value: db-less-rag-lambda-access

  DocumentsS3FilesFileSystemPolicy:
    Type: AWS::S3Files::FileSystemPolicy
    Properties:
      FileSystemId: !Ref DocumentsS3FileSystem
      Policy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowQuestionApiMount
            Effect: Allow
            Principal:
              AWS: !GetAtt QuestionApiFunctionRole.Arn
            Action:
              - s3files:ClientMount
            Resource: !Ref DocumentsS3FileSystem
            Condition:
              StringEquals:
                s3files:AccessPointArn: !GetAtt DocumentsS3FilesAccessPoint.AccessPointArn
          - Sid: AllowDocumentProcessorMount
            Effect: Allow
            Principal:
              AWS: !GetAtt DocumentProcessingFunctionRole.Arn
            Action:
              - s3files:ClientMount
            Resource: !Ref DocumentsS3FileSystem
            Condition:
              StringEquals:
                s3files:AccessPointArn: !GetAtt DocumentsS3FilesAccessPoint.AccessPointArn

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type,x-user-id'"
        AllowOrigin: !Sub "'${FrontendOrigin}'"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Document Q&A API
          version: "1.0"
        paths:
          /document:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  # Use the deterministic function name instead of GetAtt. This keeps the API
                  # definition from depending directly on the Lambda resource during deployment.
                  - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
                  - FunctionArn: !Sub
                      - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackUuid}-document-api"
                      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
          /document/upload/init:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
                  - FunctionArn: !Sub
                      - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackUuid}-document-api"
                      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
          /document/upload/part-url:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
                  - FunctionArn: !Sub
                      - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackUuid}-document-api"
                      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
          /document/upload/complete:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
                  - FunctionArn: !Sub
                      - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackUuid}-document-api"
                      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
          /document/upload/abort:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
                  - FunctionArn: !Sub
                      - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackUuid}-document-api"
                      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
          /document/process:
            post:
              # No Lambda in the write path: API Gateway enqueues the job itself. The processor
              # validates the user id and document id when it drains the message.
              responses:
                "202":
                  description: Extraction queued
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                credentials: !GetAtt ApiGatewayQueueRole.Arn
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${DocumentProcessingQueue.QueueName}"
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                requestTemplates:
                  application/json: >-
                    Action=SendMessage&MessageBody=$util.urlEncode("{""userId"":""$util.escapeJavaScript($input.params('x-user-id'))"",""documentId"":""$util.escapeJavaScript($input.path('$.documentId'))""}")
                responses:
                  default:
                    statusCode: "202"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
                    responseTemplates:
                      application/json: '{"status":"PROCESSING"}'
          /question:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${FunctionArn}/response-streaming-invocations"
                  - FunctionArn: !Sub
                      - "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackUuid}-question-api"
                      - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
                responseTransferMode: STREAM

  DocumentApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DocumentApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*

  QuestionApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref QuestionApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/question
  DocumentApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DocumentApiAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - documents/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${DocumentsBucket.Arn}/documents/*"
  DocumentApiFunction:
    Type: AWS::Serverless::Function
    Metadata: &BuildMetadata
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - handlers/api/document.ts
          - handlers/api/question.ts
          - handlers/queue/document-processor.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: true
        Target: es2022
    Properties:
      CodeUri: src/
      Handler: api/document.handler
      FunctionName: !Sub
        - "${StackUuid}-document-api"
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Role: !GetAtt DocumentApiFunctionRole.Arn
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
  QuestionApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: QuestionApiAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3files:ClientMount
                Resource: !Ref DocumentsS3FileSystem
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${DocumentsBucket.Arn}/documents/*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${LLMModel}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  !If [
                    HasLlmSecret,
                    !Ref LLMSecretArn,
                    !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:__not_configured__",
                  ]

  QuestionApiFunction:
    Type: AWS::Serverless::Function
    Metadata: *BuildMetadata
    DependsOn: S3FilesMountTargetA
    Properties:
      CodeUri: src/
      Handler: api/question.handler
      FunctionName: !Sub
        - "${StackUuid}-question-api"
        - StackUuid: !Select [2, !Split ["/", !Ref AWS::StackId]]
      Timeout: 120
      Role: !GetAtt QuestionApiFunctionRole.Arn
      Environment:
        Variables:
          DOCUMENTS_MOUNT_PATH: /mnt/documents
      VpcConfig:
        SecurityGroupIds: [!Ref RetrievalSecurityGroup]
        SubnetIds: [!Ref RetrievalSubnetA]
      FileSystemConfigs:
        - Arn: !GetAtt DocumentsS3FilesAccessPoint.AccessPointArn
          LocalMountPath: /mnt/documents
      Layers: !If [HasRipgrepLayer, [!Ref RipgrepLayerArn], !Ref AWS::NoValue]
  DocumentProcessingFunction:
    Type: AWS::Serverless::Function
    Metadata: *BuildMetadata
    DependsOn: S3FilesMountTargetA
    Properties:
      CodeUri: src/
      Handler: queue/document-processor.handler
      # Extraction is off the request path now, so it can run longer than an API call.
      # DocumentProcessingQueue.VisibilityTimeout must stay >= this value.
      Timeout: 120
      MemorySize: 1024
      Role: !GetAtt DocumentProcessingFunctionRole.Arn
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      VpcConfig:
        SecurityGroupIds: [!Ref RetrievalSecurityGroup]
        SubnetIds: [!Ref RetrievalSubnetA]
      FileSystemConfigs:
        - Arn: !GetAtt DocumentsS3FilesAccessPoint.AccessPointArn
          LocalMountPath: /mnt/documents
      Events:
        ExtractionRequested:
          Type: SQS
          Properties:
            Queue: !GetAtt DocumentProcessingQueue.Arn
            BatchSize: 1

  DocumentProcessingFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DocumentFileSystemAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The mount is read-only: the PDF is read through it, but the extracted text is written
              # with PutObject because the access point's uid 1000 cannot write into the per-document
              # directory that the presigned upload created.
              - Effect: Allow
                Action: s3files:ClientMount
                Resource: !Ref DocumentsS3FileSystem
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DocumentsBucket.Arn}/documents/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt DocumentProcessingQueue.Arn

  DocumentApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DocumentApiFunction}
      RetentionInDays: 14
  QuestionApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${QuestionApiFunction}
      RetentionInDays: 14
  DocumentProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DocumentProcessingFunction}
      RetentionInDays: 14
Outputs:
  ApiUrl:
    Description: REST API base URL for the frontend.
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  S3FilesFileSystemId:
    Value: !Ref DocumentsS3FileSystem
  RetrievalFunctionName:
    Value: !Ref QuestionApiFunction
